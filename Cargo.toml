[workspace]
resolver = "2"
members = [
    "crates/gpu",
    "crates/runtime",
    "crates/engine",
    "crates/door",
    "crates/host",
    "crates/nvml",
    "crates/docker",
    "crates/native",
    "crates/engine-http",
    "crates/peer",
]

[workspace.package]
version = "0.0.21"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/behavioralstate/best-peer"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
