name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The gate is the script every maintainer runs before the push (SDLC.md section 3): fmt, clippy, the tests, a
      # release build, then best-validate against the built peer on the fakes, anonymous, signed in over https
      # through the real device flow and `best-peer approve`, and on a workspace's cloud over two members. A manifest
      # the spec refuses fails the build. CI never needs an engine or a GPU.
      - run: scripts/gate.sh all
