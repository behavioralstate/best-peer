name: release

# A release is a tag `v<version>` on a commit of `main`, made by `scripts/release.sh`. The tag must say what
# `Cargo.toml` says; the binaries must say it too. Three targets are built from the locked tree, archived with the
# README and the licence, the Linux one with the disk helper and its units, summed, attested (SLSA build provenance) and published with notes made from the release
# commit's message and the commits since the previous release. Run by hand (workflow_dispatch) it builds and keeps the archives
# as run artifacts without publishing anything: that is how a change to this file is tried.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag is honest before anything is built: on main, on the release commit, equal to the workspace version, with
  # ci green on that commit, and the tree green here too.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: The version, from Cargo.toml; a pushed tag must match it, sit on main and be the release commit
        id: version
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"]=="best-peer"))')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Only a pushed tag publishes: a workflow_dispatch, even one started from a tag, builds and keeps.
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            tag="${GITHUB_REF#refs/tags/}"
            if [[ "$tag" != "v$version" ]]; then
              echo "::error::tag $tag does not match the workspace version $version; release with scripts/release.sh"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tag $tag is not on main"
              exit 1
            fi
            subject=$(git log -1 --format=%s "$GITHUB_SHA")
            if [[ "$subject" != "Release $version" ]]; then
              echo "::error::tag $tag is on '$subject', not on the commit 'Release $version' that scripts/release.sh makes"
              exit 1
            fi
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: ci passed on this commit (the validator gates live there; the tag usually lands seconds after the push)
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            state=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 --json status,conclusion --jq 'if length == 0 then "none" else .[0].status + "/" + .[0].conclusion end')
            case "$state" in
              completed/success) echo "ci: success"; exit 0 ;;
              completed/*) echo "::error::ci on $GITHUB_SHA ended $state; nothing is released from a red commit"; exit 1 ;;
              *) echo "ci on $GITHUB_SHA: $state; waiting"; sleep 30 ;;
            esac
          done
          echo "::error::ci on $GITHUB_SHA did not finish in 30 minutes"
          exit 1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc, not musl: the NVIDIA driver's library is loaded at run time, which a static binary cannot do.
          # Built on the oldest runner so the binary runs on any distribution with glibc 2.35 or newer.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    env:
      # Each archive is published twice, byte for byte the same: under NAME, which carries the version, for pinning,
      # and under ALIAS, which does not, so `releases/latest/download/<ALIAS>` is always the newest release and the
      # README's commands never name a version. The folder inside is ALIAS, so `cd` needs no version either.
      NAME: best-peer-${{ needs.check.outputs.version }}-${{ matrix.target }}
      ALIAS: best-peer-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p best-peer --target ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --release --locked -p best-peer-disk --target ${{ matrix.target }}
      - name: The binary says the version the tag says
        shell: bash
        run: |
          set -euo pipefail
          bin=target/${{ matrix.target }}/release/best-peer
          [[ "${{ matrix.os }}" == windows-latest ]] && bin="$bin.exe"
          said=$("$bin" --version)
          [[ "$said" == "best-peer ${{ needs.check.outputs.version }}" ]] || { echo "::error::the binary says '$said'"; exit 1; }
          if [[ "${{ matrix.target }}" == x86_64-unknown-linux-gnu ]]; then
            said=$(target/${{ matrix.target }}/release/best-peer-disk --version)
            [[ "$said" == "best-peer-disk ${{ needs.check.outputs.version }}" ]] || { echo "::error::the disk helper says '$said'"; exit 1; }
          fi
      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/$ALIAS"
          cp README.md LICENSE "dist/$ALIAS/"
          if [[ "${{ matrix.archive }}" == zip ]]; then
            cp target/${{ matrix.target }}/release/best-peer.exe "dist/$ALIAS/"
            (cd dist && 7z a -tzip "$NAME.zip" "$ALIAS" > /dev/null)
          else
            cp target/${{ matrix.target }}/release/best-peer "dist/$ALIAS/"
            if [[ "${{ matrix.target }}" == x86_64-unknown-linux-gnu ]]; then
              cp target/${{ matrix.target }}/release/best-peer-disk packaging/best-peer-disk.socket packaging/best-peer-disk@.service "dist/$ALIAS/"
            fi
            tar -C dist -czf "dist/$NAME.tar.gz" "$ALIAS"
          fi
          cp "dist/$NAME.${{ matrix.archive }}" "dist/$ALIAS.${{ matrix.archive }}"
          rm -r "dist/$ALIAS"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            dist/${{ env.NAME }}.${{ matrix.archive }}
            dist/${{ env.ALIAS }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    if: needs.check.outputs.publish == 'true'
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum best-peer-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/best-peer-*
      - name: Release notes, from the release commit's message and the commits since the previous release
        id: notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="${{ needs.check.outputs.version }}"
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$tag^" 2>/dev/null || true)
          {
            echo "# best-peer $version"
            echo
            # The message scripts/release.sh was given: it is the body of the release commit as well as the tag's
            # annotation, and the commit is read because the checkout action refetches the triggering tag as a
            # lightweight one, which loses the annotation.
            message=$(git log -1 --format=%b "$GITHUB_SHA" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')
            if [[ -n "$message" ]]; then echo "$message"; echo; fi
            if [[ -n "$previous" ]]; then
              echo "## Commits since $previous"
              range="$previous..$tag"
            else
              echo "## Commits"
              range="$tag"
            fi
            echo
            git log --no-merges --format='- %s (%h)' "$range" | grep -v -E "^- Release $version \(" || true
            echo
            echo "## Run it"
            echo
            echo "One binary, and on Linux the disk helper \`best-peer-disk\` with its two systemd units beside it, for a peer run as a user of its own (the README's \"Run as a service with the disk helper\"). Download the archive for the machine, check it against \`SHA256SUMS\`, unpack it and run \`best-peer\` with the environment the README's Run section names; \`best-peer --version\` says \`best-peer $version\`. Each archive is here twice, byte for byte the same: under the name with the version, for pinning, and under the name without it, which \`releases/latest/download/<name>\` resolves to the newest release, as the README's commands use."
            echo
            echo "| Machine | Archive | Same file, unversioned |"
            echo "|---|---|---|"
            echo "| Linux x86_64 (glibc 2.35 or newer) | \`best-peer-$version-x86_64-unknown-linux-gnu.tar.gz\` | \`best-peer-x86_64-unknown-linux-gnu.tar.gz\` |"
            echo "| Windows x86_64 | \`best-peer-$version-x86_64-pc-windows-msvc.zip\` | \`best-peer-x86_64-pc-windows-msvc.zip\` |"
            echo "| macOS Apple silicon | \`best-peer-$version-aarch64-apple-darwin.tar.gz\` | \`best-peer-aarch64-apple-darwin.tar.gz\` |"
            echo
            echo "Every archive carries a build provenance attestation: \`gh attestation verify <archive> --repo ${GITHUB_REPOSITORY}\`."
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: best-peer ${{ needs.check.outputs.version }}
          body_path: notes.md
          files: |
            dist/best-peer-*
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.check.outputs.version, '-') }}
          make_latest: ${{ !contains(needs.check.outputs.version, '-') }}
