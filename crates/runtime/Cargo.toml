[package]
name = "best-peer-runtime"
description = "The container runtime abstraction best-peer owns: pull, start, stop, observe, follow what a container writes, with a fake for tests. Adapters (Docker/containerd via bollard, ...) are separate crates and are never unit-tested."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
best-peer-gpu = { path = "../gpu" }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
