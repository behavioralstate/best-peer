[package]
name = "best-peer"
description = "A BEST peer: one binary that puts a GPU host behind a Behavioral State Protocol door."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "best-peer"
path = "src/main.rs"

[dependencies]
axum = "0.7"
best-peer-docker = { path = "../docker" }
best-peer-door = { path = "../door" }
best-peer-engine = { path = "../engine" }
best-peer-engine-http = { path = "../engine-http" }
best-peer-gpu = { path = "../gpu" }
best-peer-host = { path = "../host" }
best-peer-native = { path = "../native" }
best-peer-nvml = { path = "../nvml" }
best-peer-runtime = { path = "../runtime" }
async-trait = { workspace = true }
futures = "0.3"
hyper = { version = "1", features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "tls12", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
serde = { workspace = true }
serde_json = { workspace = true }
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# TLS: rustls on ring, no system library, so the binary stays one file on every target.
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde_urlencoded = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"

tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
