[package]
name = "best-peer-disk"
description = "The helper that makes, releases and removes a job's disk for a peer that may not mount, socket-activated by systemd and run as root for one request; and the client the Docker runtime asks it with. Its checks, the release's walk and the client are unit-tested; its mounts are proven on a host by hand."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "best-peer-disk"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
linux-raw-sys = { version = "0.12", default-features = false, features = ["loop_device", "std"] }
rustix = { version = "1", features = ["fs", "mount", "net", "process"] }

[dev-dependencies]
tempfile = "3"
