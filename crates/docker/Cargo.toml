[package]
name = "best-peer-docker"
description = "The Runtime adapter over the Docker Engine API through bollard: pull, start with devices handed over, stop, and the engine's events. Thin; proven on a host by hand, never unit-tested."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
best-peer-gpu = { path = "../gpu" }
best-peer-runtime = { path = "../runtime" }
bollard = "0.21"
futures = "0.3"
time = { version = "0.3", features = ["parsing"] }
tokio = { workspace = true }
tracing = "0.1"
